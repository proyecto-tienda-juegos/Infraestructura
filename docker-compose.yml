# Infraestructura local: MySQL (con las 5 bases de datos) y Kafka (modo KRaft, sin Zookeeper)
# Levantar:  docker compose up -d
# Detener:   docker compose down        (agrega -v para borrar tambien los datos de MySQL)
services:
  mysql:
    image: mysql:8.4
    container_name: mysql-tienda
    ports:
      - "3306:3306"   # si ya tienes MySQL instalado en tu PC, cambia a "3307:3306" y usa 3307 en los application.properties
    environment:
      MYSQL_ROOT_PASSWORD: root1234
    volumes:
      # Los .sql de esta carpeta se ejecutan solo la PRIMERA vez que arranca (volumen vacio)
      - ./mysql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  mysql_data:
