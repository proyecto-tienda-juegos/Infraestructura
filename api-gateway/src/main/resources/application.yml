server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # lb:// = "load balanced", el Gateway le pregunta a Eureka
        # donde esta corriendo "usuario-service" (lo busca por el
        # spring.application.name que cada microservicio declara)
        - id: usuario-service
          uri: lb://usuario-service
          predicates:
            - Path=/api/usuarios/**

        - id: juegos-service
          uri: lb://juegos-service
          predicates:
            - Path=/api/juegos/**

        - id: inventario-service
          uri: lb://inventario-service
          predicates:
            - Path=/api/inventario/**

        - id: carrito-service
          uri: lb://carrito-service
          predicates:
            - Path=/api/carrito/**

        - id: notificaciones-service
          uri: lb://notificaciones-service
          predicates:
            - Path=/api/notificaciones/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
